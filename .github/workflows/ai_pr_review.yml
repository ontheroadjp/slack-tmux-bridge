name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  models: read

jobs:
  ai_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect PR metadata
        id: pr_meta
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const fileList = files.map(f => `${f.status}\t${f.filename}`).join('\n') || '(no files)';
            fs.mkdirSync('tmp', { recursive: true });
            fs.writeFileSync('tmp/ai_changed_files.txt', fileList);
            fs.writeFileSync('tmp/ai_pr_body.txt', pr.body || '(no body)');
            core.setOutput('number', String(pr.number));
            core.setOutput('title', pr.title || '');
            core.setOutput('author', pr.user?.login || '');
            core.setOutput('base_ref', pr.base?.ref || '');
            core.setOutput('head_ref', pr.head?.ref || '');

      - name: Build diff
        id: diff
        run: |
          set -euo pipefail
          mkdir -p tmp
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git diff --no-color "$BASE_SHA...$HEAD_SHA" > tmp/ai_pr.diff

          MAX_BYTES=200000
          SIZE=$(wc -c < tmp/ai_pr.diff | tr -d ' ')
          TRUNCATED=false
          if [ "$SIZE" -gt "$MAX_BYTES" ]; then
            head -c "$MAX_BYTES" tmp/ai_pr.diff > tmp/ai_pr.diff.trunc
            mv tmp/ai_pr.diff.trunc tmp/ai_pr.diff
            TRUNCATED=true
          fi
          echo "truncated=$TRUNCATED" >> "$GITHUB_OUTPUT"

      - name: AI review
        id: inference
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/ai_pr_review.prompt.yml
          input: |
            repo: ${{ github.repository }}
            pr_number: ${{ steps.pr_meta.outputs.number }}
            pr_title: ${{ steps.pr_meta.outputs.title }}
            pr_author: ${{ steps.pr_meta.outputs.author }}
            base_ref: ${{ steps.pr_meta.outputs.base_ref }}
            head_ref: ${{ steps.pr_meta.outputs.head_ref }}
            diff_truncated: ${{ steps.diff.outputs.truncated }}
          file_input: |
            pr_body: tmp/ai_pr_body.txt
            changed_files: tmp/ai_changed_files.txt
            diff: tmp/ai_pr.diff

      - name: Post review comment
        uses: actions/github-script@v7
        env:
          AI_REVIEW: ${{ steps.inference.outputs.response }}
        with:
          script: |
            const body = `## AI Review (Auto)\n\n${process.env.AI_REVIEW}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
